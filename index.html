  <!--
    Apply the theme before first paint. Doing this in a React effect
    (as this site used to) shows every light-mode visitor a dark frame
    on load. Stored choice wins; otherwise follow the OS.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { /* private mode — fall through to light */ }
    })();
  </script>
